name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Nothing private, no signing keys, no store credentials
        run: |
          if git ls-files | grep -E '^(docs-private|prototype)/'; then
            echo "::error::Private folders are tracked"; exit 1
          fi
          if git ls-files | grep -E '\.(jks|keystore|p12|p8)$|google-services\.json|GoogleService-Info\.plist|(^|/)\.env'; then
            echo "::error::A key, a credential file or an .env is tracked"; exit 1
          fi
      - name: The pinned public commit is released or on develop
        run: |
          git -C vendor/fdv fetch --quiet origin develop --tags
          if git -C vendor/fdv merge-base --is-ancestor HEAD origin/develop; then
            echo "vendor/fdv is on public develop"
          elif git -C vendor/fdv describe --exact-match --tags HEAD; then
            echo "vendor/fdv is a public tag"
          else
            echo "::error::vendor/fdv points at a commit that is neither on public develop nor tagged"; exit 1
          fi

  check:
    name: Lint, typecheck, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The About screen's licence list is this build's (node scripts/licences.mjs to update)
        working-directory: apps/pocket
        run: node scripts/licences.mjs --check
      - name: The failure-state inventory is this catalogue's (node apps/pocket/scripts/failure-states.mjs to update)
        run: node apps/pocket/scripts/failure-states.mjs --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle for Android (Hermes compiles everything, @fdv/shared included)
        working-directory: apps/pocket
        run: APP_VARIANT=preview npx expo export --platform android --output-dir dist-android
      - name: expo-doctor
        working-directory: apps/pocket
        run: npx expo-doctor

  web-e2e:
    name: Connect and sign in on a real vault (web build)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: A vault from the pinned public commit, the way a self-hoster starts one
        working-directory: vendor/fdv
        run: |
          node scripts/gen-env.mjs
          sed -i 's/^FDV_PORT=.*/FDV_PORT=8099/; s#^FDV_BASE_URL=.*#FDV_BASE_URL=http://localhost:8099#' .env
          docker compose -p fdvtest up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8099/readyz && break
            sleep 5
          done
          curl -sf http://localhost:8099/api/v1/capabilities
      - name: Web build, served with /api/ passed through to the vault
        working-directory: apps/pocket
        run: pnpm web:e2e
      - name: Vault logs on failure
        if: failure()
        working-directory: vendor/fdv
        run: docker compose -p fdvtest logs --no-color | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: apps/pocket/test-results
          retention-days: 2
