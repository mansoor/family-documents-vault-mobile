name: Maestro

# The phone on an emulator, against a real vault (4.5; the lock, 4.8; kept
# Essentials in airplane mode, and wiped by a revoked session, 4.10; Show
# mode, 4.11; Back, 4.15; the largest text, 4.17; the Identity card, 5.31;
# a row's menu and a note, 5.36):
# the e2e build (x86_64, fixture scanner) runs .maestro/ flows while a vault
# from the published images runs on the host, reached as 10.0.2.2. The push
# and clipboard modules' JVM tests (4.14, 5.31) run with the build. A run costs about 40
# runner minutes, so it runs on demand, and on a pull request that changes
# the flows, the app's own native code or this workflow — not on every push.
on:
  workflow_dispatch:
  # The exit flows run on the release tags too (4.18).
  push:
    tags: ['v0.2.*']
  pull_request:
    paths:
      - apps/pocket/.maestro/**
      - apps/pocket/modules/**
      - .github/workflows/maestro.yml

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flows:
    name: Capture in airplane mode, sent once
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: e2e
      NDK_VERSION: 27.1.12297006
      EMAIL: pocket-e2e@example.test
      PASSWORD: correct horse battery staple
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Room on the runner
        # The Android build, the vault's images and the emulator do not all
        # fit on a hosted runner's disk alongside toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift             /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK (cached)
        id: ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install the NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
      - name: The e2e build
        working-directory: apps/pocket
        run: |
          npx expo prebuild --platform android --no-install --clean
          # With the push module's JVM tests: what a notification may say (4.14);
          # and the clipboard's: a copied identity number is marked sensitive and cleared (5.31).
          cd android && ./gradlew assembleRelease :unifiedpush:testDebugUnitTest :clipboard:testDebugUnitTest -PreactNativeArchitectures=x86_64 --no-daemon
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/fv-e2e.apk"
          # The APK is out; the build's intermediates are gigabytes the vault needs.
          rm -rf app/build build .gradle
          df -h /

      - name: A vault from the published images, the version the app is pinned to
        working-directory: vendor/fdv
        run: |
          git fetch --quiet --tags origin
          # The app is tested against the vault it is pinned to, or not at all.
          TAG=$(git describe --tags --exact-match) || { echo '::error::vendor/fdv is not on a release tag'; exit 1; }
          VERSION=${TAG#v}
          echo "Vault $VERSION" >> "$GITHUB_STEP_SUMMARY"
          node scripts/gen-env.mjs
          sed -i "s/^FDV_PORT=.*/FDV_PORT=8099/; s#^FDV_BASE_URL=.*#FDV_BASE_URL=http://localhost:8099#" .env
          echo "FDV_VERSION=$VERSION" >> .env
          docker compose -p fdvtest pull
          docker compose -p fdvtest up -d --no-build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8099/readyz && break
            sleep 5
          done
          curl -sf http://localhost:8099/api/v1/setup -H 'content-type: application/json' \
            -d "{\"household_name\":\"The Pocket family\",\"display_name\":\"Pocket Owner\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" > /dev/null

      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The flows, on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone-sized screen: the default is 320 × 640 at mdpi.
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell dumpsys connectivity | grep -m3 -iE 'NetworkAgentInfo|type: ' || true
            # A busy runner makes System UI slow to answer, and Android puts a
            # "System UI isn't responding" dialog over whatever the flow is
            # looking for (run 36132900051). Nobody is there to answer it.
            adb shell settings put global hide_error_dialogs 1
            # Android's "Viewing full screen" notice, shown the first time an app hides the bars (Show mode, 4.11), takes the next Back: seen already here.
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            # An http vault is used only on Wi-Fi. A freshly booted emulator
            # can still count its cellular network when the first flow signs
            # in, and the sign-in is refused as "not on Wi-Fi" (run
            # 36225210222). No flow needs mobile data: off, and wait for Wi-Fi.
            # (The action runs each line of this script on its own: one line per command.)
            adb shell svc data disable || true
            for i in $(seq 1 30); do adb shell dumpsys connectivity | grep -iE 'NetworkAgentInfo' | grep -qi wifi && break; sleep 2; done
            adb shell dumpsys connectivity | grep -iE 'NetworkAgentInfo' | head -3 || true
            adb install -r fv-e2e.apk
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-report.xml apps/pocket/.maestro/capture-offline-queue.yaml || sh .github/scripts/on-flow-failure.sh capture
            sh .github/scripts/cache-check.sh || touch cache-check-failed
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-lock.xml apps/pocket/.maestro/lock.yaml || sh .github/scripts/on-flow-failure.sh lock
            # Starts from a clean app, as the lock flow does: before the Essentials are seeded and kept.
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-back.xml apps/pocket/.maestro/back-button.yaml || sh .github/scripts/on-flow-failure.sh back
            # The phone's largest text (4.17), then back to normal for the flows after it.
            adb shell settings put system font_scale 2.0
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-large-text.xml apps/pocket/.maestro/large-text.yaml || sh .github/scripts/on-flow-failure.sh large-text
            adb shell settings put system font_scale 1.0
            sh .github/scripts/essentials-seed.sh || touch essentials-seed-failed
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-essentials.xml apps/pocket/.maestro/offline-essential.yaml || sh .github/scripts/on-flow-failure.sh essentials
            $HOME/.maestro/bin/maestro test --format junit --output maestro-show.xml apps/pocket/.maestro/show-mode.yaml || sh .github/scripts/on-flow-failure.sh show
            sh .github/scripts/essentials-files.sh present || touch essentials-kept-failed
            sh .github/scripts/essentials-revoke.sh || touch essentials-revoke-failed
            $HOME/.maestro/bin/maestro test --format junit --output maestro-revoked.xml apps/pocket/.maestro/essentials-revoked.yaml || sh .github/scripts/on-flow-failure.sh revoked
            sh .github/scripts/essentials-files.sh absent || touch essentials-gone-failed
            # The Identity card (5.31): masked, then shown after the step-up. The flow waits out the five minutes a sign-in counts as confirming it is you, with the screen kept on.
            sh .github/scripts/identity-seed.sh || touch identity-seed-failed
            adb shell svc power stayon true || true
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-identity.xml apps/pocket/.maestro/identity.yaml || sh .github/scripts/on-flow-failure.sh identity
            # A row's menu, from its ⋯ and a long press, and a note drawn on the document (5.36).
            sh .github/scripts/notes-seed.sh || touch notes-seed-failed
            $HOME/.maestro/bin/maestro test -e EMAIL="$EMAIL" -e PASSWORD="$PASSWORD" --format junit --output maestro-row-menu.xml apps/pocket/.maestro/row-menu.yaml || sh .github/scripts/on-flow-failure.sh row-menu
            sh -c 'for f in capture-failed lock-failed cache-check-failed essentials-seed-failed essentials-failed show-failed back-failed large-text-failed essentials-kept-failed essentials-revoke-failed revoked-failed essentials-gone-failed identity-seed-failed identity-failed notes-seed-failed row-menu-failed; do if [ -f "$f" ]; then echo "failed: $f"; exit 1; fi; done'

      - name: Exactly one document, carrying the card's fields
        run: |
          TOKEN=$(curl -sf http://localhost:8099/api/v1/auth/password -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" | jq -r .access_token)
          curl -sf "http://localhost:8099/api/v1/documents?limit=200" -H "authorization: Bearer $TOKEN" > docs.json
          jq '.items | map({title, type_key, owner_member_id, identifier, expires, status})' docs.json
          test "$(jq '.items | length' docs.json)" = "1"
          test "$(jq -r '.items[0].type_key' docs.json)" = "passport"
          test "$(jq -r '.items[0].owner_member_id' docs.json)" != "null"
          # What the card waited for (0.2.1): the passport's number and expiry, so it needs nothing more.
          test "$(jq -r '.items[0].identifier' docs.json)" = "123456789"
          test "$(jq -r '.items[0].expires.date' docs.json)" = "2031-03-14"
          test "$(jq -r '.items[0].status.value' docs.json)" != "needs_info"
          echo "One document, a passport with its person, number and expiry: the scan saved offline arrived once." >> "$GITHUB_STEP_SUMMARY"

      - name: Vault logs on failure
        if: failure()
        working-directory: vendor/fdv
        run: docker compose -p fdvtest logs --no-color | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            maestro-lock.xml
            maestro-large-text.xml
            maestro-back.xml
            maestro-essentials.xml
            maestro-show.xml
            maestro-revoked.xml
            maestro-identity.xml
            maestro-row-menu.xml
            app-files.txt
            essentials-files.txt
            ui-*.xml
            rn-*.log
            ~/.maestro/tests/
          retention-days: 3
      - name: Minutes
        if: always()
        run: echo "Took $(( ($(date +%s) - STARTED) / 60 )) minutes" >> "$GITHUB_STEP_SUMMARY"
