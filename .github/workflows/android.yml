name: Android

# APKs are built here, never on the development machine (it has no Android
# SDK). dev: the development client, JavaScript from Metro. preview: a
# release build with the JavaScript embedded, debug-signed, for throwaway
# vaults only. Both are published as rolling pre-releases.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which build
        type: choice
        options: [preview, dev, kvm-probe]
        default: preview
  push:
    tags: ['v*']
    branches: [develop]
    paths:
      - apps/pocket/app.config.ts
      - apps/pocket/package.json
      - pnpm-lock.yaml
      - apps/pocket/plugins/**
      - apps/pocket/modules/**

concurrency:
  group: android-${{ github.ref }}-${{ inputs.variant || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: inputs.variant != 'kvm-probe'
    name: Build ${{ inputs.variant || (startsWith(github.ref, 'refs/tags/') && 'preview') || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: ${{ inputs.variant || (startsWith(github.ref, 'refs/tags/') && 'preview') || 'dev' }}
      # Every step, Gradle's included: its bundling step reads app.config.ts
      # and babel.config.js again, and without this they would say dev.
      APP_VARIANT: ${{ inputs.variant || (startsWith(github.ref, 'refs/tags/') && 'preview') || 'dev' }}
      NDK_VERSION: 27.1.12297006
    steps:
      - name: Start the clock
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK (cached)
        id: ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install the NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
      - name: Generate the native project
        working-directory: apps/pocket
        run: npx expo prebuild --platform android --no-install --clean
      - name: Gradle
        working-directory: apps/pocket/android
        run: |
          if [ "$VARIANT" = "dev" ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          ./gradlew "$TASK" -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Verify the signature and name the file
        working-directory: apps/pocket/android/app/build/outputs/apk
        run: |
          APK=$(find . -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | head -5
          SHORT=$(git rev-parse --short HEAD)
          cp "$APK" "$GITHUB_WORKSPACE/fv-$VARIANT-$SHORT.apk"
          echo "APK=fv-$VARIANT-$SHORT.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 2
      - name: Publish as the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="$VARIANT-latest"
          if ! gh release view "$RELEASE" > /dev/null 2>&1; then
            gh release create "$RELEASE" --prerelease --target "$GITHUB_SHA" \
              --title "$VARIANT build (rolling)" \
              --notes "The latest $VARIANT build. Test builds talk to throwaway vaults only."
          fi
          gh release upload "$RELEASE" "$APK" --clobber
      - name: Minutes
        if: always()
        run: echo "Build took $(( ($(date +%s) - STARTED) / 60 )) minutes ($VARIANT)" >> "$GITHUB_STEP_SUMMARY"

  kvm-probe:
    if: inputs.variant == 'kvm-probe'
    name: Emulator boot probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb shell getprop sys.boot_completed
            echo "Emulator booted" >> "$GITHUB_STEP_SUMMARY"
