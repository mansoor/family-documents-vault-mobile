// Copying an identity number (5.31): a local Expo module that puts it on
// Android's clipboard marked sensitive — Android 13 and later show dots, not
// the number, in the clipboard's preview and a keyboard's suggestions — and
// clears it after a minute, also while the app is at the back.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.mansoor.familyvault'
version = '0.1.0'

android {
  namespace "io.github.mansoor.familyvault.clipboard"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
