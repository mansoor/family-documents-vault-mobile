# The redesign (R7, app 0.5.0), against the vault the app is pinned to,
# after attention-seed.sh has given the passport a reminder due today:
#  - Home: the reminder as an alert, hidden for a week from its ✕;
#  - the bell, counting it; Needs attention under Now, put off a week
#    from Later, and then under Coming up; the bell without a number;
#  - dark: the filters, the passport's page and Needs attention.
# Screenshots are allowed first (Settings), so each screen is captured
# (shot-*.png). A document's own pages are never captured.
appId: io.github.mansoor.familyvault.e2e
env:
  VAULT: 10.0.2.2:8099
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: connect-address
    timeout: 60000
- tapOn:
    id: connect-address
- inputText: ${VAULT}
- hideKeyboard
- tapOn:
    id: connect-go
- extendedWaitUntil:
    visible:
      id: connect-approve-http
    timeout: 30000
- tapOn:
    id: connect-approve-http
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-go
# The owner's code: the vault of 0.9.0 asks every owner for two-step sign-in.
- runFlow: common/sign-in-code.yaml
- extendedWaitUntil:
    visible:
      id: home-list
    timeout: 30000

# Screenshots allowed, and the light theme fixed, in Settings.
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: settings-screenshots
- tapOn:
    id: settings-screenshots
- scrollUntilVisible:
    element:
      id: settings-theme-light
- tapOn:
    id: settings-theme-light
- back
- extendedWaitUntil:
    visible:
      id: home-list
    timeout: 15000

# The +: its three choices fanned out above it, and the + an ✕ (11 Nov
# 2026); the ✕ closes it.
- tapOn:
    id: home-add
- extendedWaitUntil:
    visible:
      id: add-picture
    timeout: 10000
- assertVisible:
    id: add-file
- assertVisible:
    id: add-camera
- waitForAnimationToEnd
- takeScreenshot: shot-light-add
- tapOn:
    id: add-cancel
- extendedWaitUntil:
    notVisible:
      id: add-menu
    timeout: 10000

# Home: the reminder as an alert, and the bell counting it.
- extendedWaitUntil:
    visible:
      id: home-alert-.*-hide
    timeout: 30000
- assertVisible:
    id: bell-count
- waitForAnimationToEnd
- takeScreenshot: shot-light-home-alert
# Its ✕: hidden for a week, and Undo offered.
- tapOn:
    id: home-alert-.*-hide
- extendedWaitUntil:
    visible:
      id: alert-hide-7
    timeout: 10000
- tapOn:
    id: alert-hide-7
- extendedWaitUntil:
    visible:
      id: home-alert-hidden
    timeout: 10000
- assertNotVisible:
    id: home-alert-.*-hide

# The bell: Needs attention, under Now; Later, a week; then under Coming up.
- tapOn:
    id: bell
- extendedWaitUntil:
    visible:
      id: attention-now
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: shot-light-attention-now
- tapOn:
    id: later-.*
- extendedWaitUntil:
    visible:
      id: snooze-week-.*
    timeout: 10000
- tapOn:
    id: snooze-week-.*
# Put off, it leaves Now (which says so) and is under Coming up.
- extendedWaitUntil:
    notVisible:
      id: later-sheet
    timeout: 10000
- tapOn:
    id: attention-tab-coming
- extendedWaitUntil:
    visible:
      id: attention-coming
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: shot-light-attention-coming
- back
- extendedWaitUntil:
    visible:
      id: home-list
    timeout: 15000
# Nothing due: the bell has no number.
- extendedWaitUntil:
    notVisible:
      id: bell-count
    timeout: 15000

# The gaps review (11 Nov 2026): a tag added to the passport in Edit
# details, and the Trash in More. The keyboard never hides what is typed
# (0.26.0): the Tags field, low on the page, is scrolled above the
# keyboard as it opens, so the word typed is seen, and Add beside it is
# tapped with the keyboard still up — behind the keyboard, the tap would
# land on a key and nothing would be added.
- tapOn:
    id: tab-documents
- extendedWaitUntil:
    visible:
      id: doc-row-.*
    timeout: 15000
- tapOn:
    id: doc-row-.*
- extendedWaitUntil:
    visible:
      id: document-edit
    timeout: 15000
- tapOn:
    id: document-edit
- scrollUntilVisible:
    element:
      id: edit-tag-new
    timeout: 30000
- tapOn:
    id: edit-tag-new
- inputText: renew
- assertVisible:
    id: edit-tag-new
    text: renew
- tapOn:
    id: edit-tag-add
- extendedWaitUntil:
    visible:
      id: edit-tag-renew
    timeout: 10000
- hideKeyboard
- takeScreenshot: shot-light-edit-tags
- scrollUntilVisible:
    element:
      id: edit-save
- tapOn:
    id: edit-save
- scrollUntilVisible:
    element:
      id: document-tags
    timeout: 30000
- assertVisible: .*renew.*
# Recently used (0.26.0): in Edit details again, renew taken off (not
# saved), the Tags field given the focus: renew, put on the passport just
# now, is offered as a pill above the field, and is tapped with the
# keyboard still up — a tap, since a pill under the keyboard would still
# count as visible. Saved as it was.
- tapOn:
    id: document-edit
- scrollUntilVisible:
    element:
      id: edit-tag-renew
    timeout: 30000
- tapOn:
    id: edit-tag-renew
- tapOn:
    id: edit-tag-new
- extendedWaitUntil:
    visible:
      id: edit-tag-offer-renew
    timeout: 15000
- tapOn:
    id: edit-tag-offer-renew
- extendedWaitUntil:
    visible:
      id: edit-tag-renew
    timeout: 10000
- hideKeyboard
- tapOn:
    id: edit-save
- extendedWaitUntil:
    visible:
      id: document-more
    timeout: 15000
# A reminder set yourself (0.5.3): in a week, with a note, from the ⋯.
- tapOn:
    id: document-more
- extendedWaitUntil:
    visible:
      id: document-remind
    timeout: 10000
- tapOn:
    id: document-remind
- tapOn:
    id: remind-in-week
- tapOn:
    id: remind-note
- inputText: Book the renewal
- hideKeyboard
- tapOn:
    id: remind-yes
- scrollUntilVisible:
    element:
      id: document-notice
    direction: UP
    timeout: 15000
- assertVisible: You will be reminded on.*
# Share (0.5.3): a link to the passport, made from its ⋯ and shown once.
- tapOn:
    id: document-more
- extendedWaitUntil:
    visible:
      id: document-share
    timeout: 10000
- tapOn:
    id: document-share
- extendedWaitUntil:
    visible:
      id: share-label
    timeout: 15000
- tapOn:
    id: share-label
- inputText: Dr Patel
- hideKeyboard
- tapOn:
    id: share-protect-pin
- scrollUntilVisible:
    element:
      id: share-make
- tapOn:
    id: share-make
# The passport is sensitive by its kind (a vault of 0.9.0-dev.41, H1a): asked first, in the web's words.
- extendedWaitUntil:
    visible:
      id: share-sensitive-yes
    timeout: 15000
- assertVisible: This document is sensitive.*
- takeScreenshot: shot-light-share-sensitive
- tapOn:
    id: share-sensitive-yes
# An Essential's link may ask to confirm it is you.
# The password, or the owner's code where only a code will do.
- runFlow: common/step-up.yaml
- extendedWaitUntil:
    visible:
      id: share-reveal
    timeout: 20000
# The link and its PIN behind the eye (0.5.6).
- tapOn:
    id: share-reveal
- assertVisible:
    id: share-link
- assertVisible:
    id: share-secret
- takeScreenshot: shot-light-share
- scrollUntilVisible:
    element:
      id: share-done
- tapOn:
    id: share-done
- back
- tapOn:
    id: tab-more
# Sharing in More: the link just made, ended after asking.
- scrollUntilVisible:
    element:
      id: more-sharing
- tapOn:
    id: more-sharing
- extendedWaitUntil:
    visible:
      id: sharing-end-.*
    timeout: 15000
- takeScreenshot: shot-light-sharing
# Show the link (0.5.7, a vault of 0.9.0-dev.30): shown again after confirming it is you.
- tapOn:
    id: sharing-show-.*
# The password, or the owner's code where only a code will do.
- runFlow: common/step-up.yaml
- extendedWaitUntil:
    visible:
      id: sharing-shown-link
    timeout: 20000
- assertVisible:
    id: sharing-shown-secret
- takeScreenshot: shot-light-shown
- scrollUntilVisible:
    element:
      id: sharing-shown-done
- tapOn:
    id: sharing-shown-done
- tapOn:
    id: sharing-end-.*
- tapOn:
    id: sharing-end-yes
- extendedWaitUntil:
    visible:
      id: sharing-said
    timeout: 15000
# Ask for documents (0.18.0): the phone's own form, looked at and left with Cancel.
- scrollUntilVisible:
    element:
      id: requests-ask
- tapOn:
    id: requests-ask
- extendedWaitUntil:
    visible:
      id: ask-title
    timeout: 15000
- takeScreenshot: shot-light-ask
- scrollUntilVisible:
    element:
      id: ask-cancel
- tapOn:
    id: ask-cancel
- extendedWaitUntil:
    visible:
      id: sharing
    timeout: 15000
- back
- scrollUntilVisible:
    element:
      id: more-trash
- tapOn:
    id: more-trash
- extendedWaitUntil:
    visible:
      id: trash
    timeout: 15000
- takeScreenshot: shot-light-trash
- back
# Activity (0.17.0): who did what, newest first; above the Trash in More.
- scrollUntilVisible:
    element:
      id: more-activity
    direction: UP
- tapOn:
    id: more-activity
- extendedWaitUntil:
    visible:
      id: activity-count
    timeout: 15000
- takeScreenshot: shot-light-activity
- back
# Emergency information (0.19.0): changed on the phone. One's own page (first in
# the list), its Edit opened and left as it was. No screenshot: the page blocks them.
- scrollUntilVisible:
    element:
      id: more-emergency
- tapOn:
    id: more-emergency
- extendedWaitUntil:
    visible:
      id: emergency-person-.*
    timeout: 15000
- tapOn:
    id: emergency-person-.*
- extendedWaitUntil:
    visible:
      id: emergency-edit-open
    timeout: 15000
- tapOn:
    id: emergency-edit-open
- extendedWaitUntil:
    visible:
      id: emergency-edit-save
    timeout: 15000
- tapOn:
    id: emergency-edit-cancel
- extendedWaitUntil:
    visible:
      id: emergency-edit-open
    timeout: 15000
- back
- back
# The tidy-up (0.5.4): Notes with its + beside the bell; Home's four counts.
- tapOn:
    id: tab-notes
- extendedWaitUntil:
    visible:
      id: notes-new
    timeout: 15000
- takeScreenshot: shot-light-notes
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: home-list
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home-count-notes
    timeout: 15000
- takeScreenshot: shot-light-home-counts

# Dark: the filters, the passport's page, and Needs attention.
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: settings-theme-dark
- tapOn:
    id: settings-theme-dark
- back
- extendedWaitUntil:
    visible:
      id: home-list
    timeout: 15000
- tapOn:
    id: tab-documents
- extendedWaitUntil:
    visible:
      id: doc-row-.*
    timeout: 15000
# The search box and its filters open from the title row's magnifier (0.5.6).
- tapOn:
    id: documents-search
- tapOn:
    id: documents-filters
- extendedWaitUntil:
    visible:
      id: filter-status-active
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: shot-dark-filters
- tapOn:
    id: filters-close
- extendedWaitUntil:
    notVisible:
      id: filter-status-active
    timeout: 10000
- tapOn:
    id: doc-row-.*
- extendedWaitUntil:
    visible:
      id: document-visibility
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: shot-dark-document
- back
- extendedWaitUntil:
    visible:
      id: doc-row-.*
    timeout: 15000
- tapOn:
    id: bell
- extendedWaitUntil:
    visible:
      id: attention-coming
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: shot-dark-attention-coming
- back
