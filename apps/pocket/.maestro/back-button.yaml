# Iteration 4.15's Back rules, on an emulator (the e2e build), against the
# same vault as the other flows (10.0.2.2:8099):
#  - Settings: Back on "Use another vault?" keeps this vault; Back again
#    goes Home.
#  - The + menu: Back closes it, and so does a tap outside it.
#  - The capture card with a scan: Back asks; Keep editing stays on the
#    card; Throw away leaves it — nothing reaches the vault (the document
#    count after the flows stays at one).
# Back in Show mode and on the lock screen: show-mode.yaml and lock.yaml.
appId: io.github.mansoor.familyvault.e2e
env:
  VAULT: 10.0.2.2:8099
---
- launchApp:
    clearState: true
- tapOn:
    id: connect-address
- inputText: ${VAULT}
- hideKeyboard
- tapOn:
    id: connect-go
- tapOn:
    id: connect-approve-http
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-go
- extendedWaitUntil:
    visible:
      id: home-calm
    timeout: 30000
- waitForAnimationToEnd

# Settings: a question, then Back.
- tapOn: Settings
- extendedWaitUntil:
    visible:
      id: settings-change-vault
    timeout: 15000
- tapOn:
    id: settings-change-vault
- assertVisible:
    id: change-vault-question
- back
- assertNotVisible:
    id: change-vault-question
- assertVisible:
    id: settings-change-vault
- back
- extendedWaitUntil:
    visible:
      id: home-calm
    timeout: 15000

# The + menu: Back closes it; a tap above it closes it too.
- tapOn:
    id: home-add
- extendedWaitUntil:
    visible:
      id: add-menu
    timeout: 10000
- assertVisible:
    id: add-file
- assertVisible:
    id: add-camera
- assertVisible:
    id: add-picture
- back
- assertNotVisible:
    id: add-menu
- assertVisible:
    id: home-calm
- tapOn:
    id: home-add
- extendedWaitUntil:
    visible:
      id: add-menu
    timeout: 10000
- tapOn:
    point: 50%,15%
- assertNotVisible:
    id: add-menu

# The capture card with a scan on it: the +, then Camera.
- tapOn:
    id: home-add
- tapOn:
    id: add-camera
- extendedWaitUntil:
    visible:
      id: capture-card
    timeout: 30000
- back
- assertVisible:
    id: leave-question
- tapOn:
    id: leave-keep
- assertNotVisible:
    id: leave-question
- assertVisible:
    id: capture-card
- back
- tapOn:
    id: leave-throw
- extendedWaitUntil:
    visible:
      id: home-calm
    timeout: 15000
- assertNotVisible:
    id: capture-card
