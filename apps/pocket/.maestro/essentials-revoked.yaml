# Iteration 4.10: after offline-essential.yaml, the vault revoked the
# phone's session (the workflow did, through the API:
# .github/scripts/essentials-revoke.sh). The next time the app reaches the
# vault it is signed out, and every kept copy goes with the session — the
# sign-in screen offers nothing kept, and the workflow then checks the
# phone's files (.github/scripts/essentials-files.sh absent).
appId: io.github.mansoor.familyvault.e2e
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: lock-screen
    timeout: 30000
- tapOn:
    id: lock-unlock
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 60000
- assertNotVisible:
    id: essentials-signed-out
