# Iteration 4.5's proof on an emulator (the e2e build: fixture scanner,
# x86_64), against a vault from the published images on the host
# (10.0.2.2:8099). A scan saved in airplane mode survives the app being
# stopped, and reaches the vault once, with the card's details. The
# workflow then asks the vault's API that exactly one such document exists.
# Since 0.2.1 (a vault of 0.5.11, custom_types) the card knows, offline,
# what a passport requires — its number and its expiry — and Save waits
# for them.
appId: io.github.mansoor.familyvault.e2e
env:
  VAULT: 10.0.2.2:8099
---
- launchApp:
    clearState: true
- tapOn:
    id: connect-address
- inputText: ${VAULT}
- hideKeyboard
- tapOn:
    id: connect-go
- tapOn:
    id: connect-approve-http
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-go
# Home has what it needs from the vault, and the card's choices are kept
# on the phone (a marker only the e2e build draws).
- extendedWaitUntil:
    visible:
      id: home-calm
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: e2e-card-kept
    timeout: 30000
- waitForAnimationToEnd

# Airplane mode on: the card works from what the phone last saw.
- setAirplaneMode: enabled
# The + in the tab bar, then Camera.
- tapOn:
    id: home-add
- tapOn:
    id: add-camera
- scrollUntilVisible:
    element: Passport
- tapOn: Passport
- scrollUntilVisible:
    element: .*\(Yours\)
- tapOn: .*\(Yours\)
- scrollUntilVisible:
    element:
      id: capture-save
- tapOn:
    id: capture-save
# Save waits for what a passport requires, says what, and opens the details.
- assertVisible: 'Still needed: Passport number and Expires.*'
- scrollUntilVisible:
    element:
      id: field-number
    direction: UP
- assertVisible: 'Passport number \* required'
- tapOn:
    id: field-number
- inputText: '123456789'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: field-expires
- tapOn:
    id: field-expires
- inputText: 14/03/2031
- hideKeyboard
- scrollUntilVisible:
    element:
      id: capture-save
- tapOn:
    id: capture-save
- assertVisible: Saved on this phone.*
- assertVisible: Waiting to send

# Stopped for real, then the connection comes back, then opened again.
- stopApp
- setAirplaneMode: disabled
- launchApp
# Cold start with somebody signed in: the lock (4.8; the e2e build's opens with a tap).
- extendedWaitUntil:
    visible:
      id: lock-screen
    timeout: 30000
- tapOn:
    id: lock-unlock
# The scan is on Home — on its way, or already in Recently added — and
# then gone from the queue: it has reached the vault.
- extendedWaitUntil:
    visible: Pocket's passport
    timeout: 30000
- extendedWaitUntil:
    notVisible: On its way
    timeout: 120000
- assertVisible: Pocket's passport
